buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        mavenLocal()
        maven { url("$rootDir/../node_modules/detox/Detox-android") }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // The React Native Gradle plugin adds Maven Central first. Without this filter, a published
        // Synchro release with the same version replaces the SDK that release-kotlin-local publishes.
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeGroup("fit.trainstar") }
        }
        maven { url("$rootDir/../node_modules/detox/Detox-android") }
        google()
        mavenCentral()
    }
}
