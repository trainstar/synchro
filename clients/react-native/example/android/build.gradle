buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 37
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.4.21"
    }
    repositories {
        mavenLocal()
        maven { url("$rootDir/../node_modules/detox/Detox-android") }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.4.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // The React Native Gradle plugin adds Maven Central first. Without this filter, a published
        // Synchro release with the same version replaces the SDK that release-kotlin-local publishes.
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeGroup("fit.trainstar") }
        }
        maven { url("$rootDir/../node_modules/detox/Detox-android") }
        google()
        mavenCentral()
    }
}
