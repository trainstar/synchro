version: 2
updates:
  - package-ecosystem: gomod
    directory: /api/go
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /conformance
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-conformance-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /extensions
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      swift-root-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /clients/swift
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      swift-client-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /clients/kotlin
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      kotlin-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /clients/react-native
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rn-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      docs-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
