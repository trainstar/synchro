name: Dependency Scan

on:
  workflow_call:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: scan dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-dependencies.sarif
          exit-code: 1

      - name: Upload dependency scan results
        if: ${{ always() && hashFiles('trivy-dependencies.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-dependencies.sarif

  result:
    name: result
    if: always()
    needs: dependency-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Require dependency scan success
        run: test "${{ needs.dependency-scan.result }}" = success
