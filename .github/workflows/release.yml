name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - name: Validate release metadata alignment
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            make version-check EXPECTED_TAG="${GITHUB_REF_NAME}"
          else
            make version-check
          fi

      - name: Validate React Native package packing
        run: make release-npm-dry-run

  validate-quality:
    needs: validate-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - name: Install PostgreSQL extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang \
            flex \
            bison \
            libclang-dev \
            libreadline-dev \
            libssl-dev \
            libxml2-dev \
            libxml2-utils \
            libxslt-dev \
            pkg-config \
            xsltproc \
            zlib1g-dev

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Run Go lint checks
        run: make lint-go

      - name: Run Rust lint checks
        run: make lint-rust-core

      - name: Run React Native lint checks
        run: make lint-rn

      - name: Run React Native unit tests
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-rn-unit \
            --output dist/verification/gate-results/test-rn-unit.json \
            -- make test-rn-unit

      - name: Run conformance tests
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-conformance \
            --output dist/verification/gate-results/test-conformance.json \
            -- make test-conformance

      - name: Publish quality gate result
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-gate-results-quality
          path: dist/verification/gate-results

  linux-pgrx-runtime:
    needs: validate-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-pgrx-pg18

      - name: Archive PG18 pgrx runtime
        run: tar -C "$HOME" -cf "$RUNNER_TEMP/pgrx-pg18-linux.tar" .pgrx

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux.tar
          compression-level: 0

  validate-server:
    runs-on: ubuntu-24.04
    needs: [validate-metadata, linux-pgrx-runtime]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - name: Verify PostgreSQL 18 for pgrx
        run: |
          test -f "$HOME/.pgrx/config.toml"
          grep -q '^pg18' "$HOME/.pgrx/config.toml"

      - name: Validate Rust core
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-rust-core \
            --output dist/verification/gate-results/test-rust-core.json \
            -- make test-rust-core

      - name: Validate PostgreSQL extension lint
        run: make lint-rust-pg

      - name: Validate PostgreSQL extension
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-rust-pg \
            --output dist/verification/gate-results/test-rust-pg.json \
            -- make test-rust-pg

      - name: Provision local PostgreSQL for the adapter
        run: |
          pg_config="$(awk -F'"' '/^pg18[[:space:]]*=/ { print $2 }' "$HOME/.pgrx/config.toml")"
          test -x "$pg_config"
          make local-postgres-start PGRX_PG_CONFIG="$pg_config"
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Validate Go adapter
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-adapter \
            --output dist/verification/gate-results/test-adapter.json \
            -- make test-adapter

      - name: Publish server gate results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-gate-results-server
          path: dist/verification/gate-results

  validate-swift:
    needs: validate-metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew

      - uses: ./.github/actions/setup-conformance-pg18
        with:
          jwt-secret-file-name: jwt-password

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: Start the local PostgreSQL for the adapter
        run: |
          make local-postgres-start
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Validate Apple package metadata
        run: make release-pods-check

      - name: Validate Swift unit tests
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-swift-unit \
            --output dist/verification/gate-results/test-swift-unit.json \
            -- make test-swift-unit

      - name: Validate Swift SDK
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-swift \
            --output dist/verification/gate-results/test-swift.json \
            -- make test-swift

      - name: Publish Swift gate results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-gate-results-swift
          path: dist/verification/gate-results

  validate-rn-ios:
    needs: validate-metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew

      - uses: actions/cache@v5.0.4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            clients/react-native/example/ios/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('clients/react-native/example/ios/Podfile.lock', 'Synchro.podspec', 'clients/react-native/SynchroReactNative.podspec') }}

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Provision local PostgreSQL for the adapter
        run: |
          pg_config="$(awk -F'"' '/^pg18[[:space:]]*=/ { print $2 }' "$HOME/.pgrx/config.toml")"
          test -x "$pg_config"
          make local-postgres-start PGRX_PG_CONFIG="$pg_config"
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: Ensure Detox iOS utilities are available
        env:
          # Homebrew 6 requires explicit tap trust, and CI provisions a fresh
          # runner every time, so the trust prompt cannot be answered.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          if ! command -v applesimutils >/dev/null 2>&1; then
            brew tap wix/brew
            brew install applesimutils
          fi

      - name: Reset Watchman state
        run: |
          if command -v watchman >/dev/null 2>&1; then
            watchman watch-del "$GITHUB_WORKSPACE/clients/react-native" || true
            watchman watch-project "$GITHUB_WORKSPACE/clients/react-native"
          fi

      - name: Validate React Native iOS bridge
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-rn-e2e-ios \
            --output dist/verification/gate-results/test-rn-e2e-ios.json \
            -- make test-rn-e2e-ios

      - name: Publish React Native iOS gate results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-gate-results-rn-ios
          path: dist/verification/gate-results

  validate-kotlin:
    runs-on: ubuntu-24.04
    needs: [validate-metadata, linux-pgrx-runtime, package-extension]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KOTLIN_ANDROID_SERIAL: emulator-5554
      GRADLE_TEST_ARGS: ""
      SYNCHRO_TEST_URL: http://localhost:8091
      SYNCHRO_TEST_JWT_SECRET: test-secret-for-integration-tests
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - name: Verify PostgreSQL 18 for pgrx
        run: |
          test -f "$HOME/.pgrx/config.toml"
          grep -q '^pg18' "$HOME/.pgrx/config.toml"

      - uses: ./.github/actions/setup-conformance-pg18

      - uses: actions/download-artifact@v8.0.1
        with:
          name: synchro-pg-pg18-linux-x64
          path: ${{ runner.temp }}/synchro-pg-pg18-linux-x64

      - name: Restore packaged PostgreSQL 18 extension
        run: |
          mkdir -p "$RUNNER_TEMP/packaged-extension"
          tar -C "$RUNNER_TEMP/packaged-extension" -xzf "$RUNNER_TEMP/synchro-pg-pg18-linux-x64/synchro-pg-pg18-linux-x64.tar.gz"
          test -f "$RUNNER_TEMP/packaged-extension/synchro-pg-pg18/artifact-manifest.json"
          echo "SYNCHRO_CONFORMANCE_EXTENSION_ARTIFACT=$RUNNER_TEMP/packaged-extension/synchro-pg-pg18" >> "$GITHUB_ENV"

      - name: Start packaged PostgreSQL 18 adapter
        run: |
          make local-postgres-start CONFORMANCE_EXTENSION_ARTIFACT="$SYNCHRO_CONFORMANCE_EXTENSION_ARTIFACT"
          database_url="$(cat .ignore/r2/tmp/local-postgres/postgres.url)"
          (cd conformance && DATABASE_URL="$database_url" GOFLAGS= GOWORK=off go run ./cmd/synchro-local-postgres prepare --repo-root ..)
          DATABASE_URL="$database_url" \
            JWT_SECRET="$SYNCHRO_TEST_JWT_SECRET" \
            LISTEN_ADDR=:8091 \
            SYNCHROD_ADAPTER_BINARY="$SYNCHRO_CONFORMANCE_ADAPTER_ARTIFACT" \
            SYNCHROD_ADAPTER_PID_FILE="$GITHUB_WORKSPACE/.synchrod-pg-test.pid" \
            SYNCHROD_ADAPTER_LOG_FILE="$GITHUB_WORKSPACE/.synchrod-pg-test.log" \
            scripts/ci/start-adapter.sh
          echo "ADAPTER_TEST_URL=$database_url" >> "$GITHUB_ENV"

      - name: Verify Android SDK tooling
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Set Android Java home
        run: echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Validate Kotlin unit tests
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-kotlin-unit \
            --output dist/verification/gate-results/test-kotlin-unit.json \
            -- make test-kotlin-unit

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation release gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Synchro_Kotlin_API_34
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            scripts/ci/capture-gate-result.py --gate test-kotlin-instrumentation --output dist/verification/gate-results/test-kotlin-instrumentation.json -- make test-kotlin-instrumentation
            make test-client-platforms SUPPORT_CELL_ID=SUP-PG-LINUX-X64-001 SUPPORT_PLATFORM_VERSION=18

      - name: Validate Kotlin SDK
        run: |
          scripts/ci/capture-gate-result.py \
            --gate test-kotlin \
            --output dist/verification/gate-results/test-kotlin.json \
            -- make test-kotlin

      - name: Publish Kotlin gate results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-gate-results-kotlin
          path: dist/verification/gate-results

      - name: Publish PostgreSQL Linux x64 packaged smoke result
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-packaged-smoke-cells-pg-linux-x64
          path: dist/verification/packaged-smoke-cells/SUP-PG-LINUX-X64-001.json

  validate-rn-android:
    runs-on: ubuntu-24.04
    needs: [validate-metadata, linux-pgrx-runtime]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_TEST_ARGS: ""
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - name: Verify PostgreSQL 18 for pgrx
        run: |
          test -f "$HOME/.pgrx/config.toml"
          grep -q '^pg18' "$HOME/.pgrx/config.toml"

      - name: Verify Android SDK tooling
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Set Android Java home
        run: echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Provision local PostgreSQL for the adapter
        run: |
          pg_config="$(awk -F'"' '/^pg18[[:space:]]*=/ { print $2 }' "$HOME/.pgrx/config.toml")"
          test -x "$pg_config"
          make local-postgres-start PGRX_PG_CONFIG="$pg_config"
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Build React Native Android Detox app
        run: make test-rn-e2e-android-build

      - name: Cache Android AVD
        id: rn-android-avd-cache
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: rn-android-avd-${{ runner.os }}-api34-google-apis-x86_64-pixel_7

      - name: Generate Android AVD snapshot
        if: steps.rn-android-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Pixel_7_API_34
          profile: pixel_7
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated Android AVD snapshot"

      - name: Validate React Native Android bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Pixel_7_API_34
          profile: pixel_7
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            scripts/ci/capture-gate-result.py --gate test-rn-e2e-android --output dist/verification/gate-results/test-rn-e2e-android.json -- make test-rn-e2e-android-run

      - name: Report the Android crash log
        if: failure()
        timeout-minutes: 2
        run: timeout 60 adb logcat -d AndroidRuntime:E ActivityManager:I "*:S" | tail -n 150 || true

      - name: Publish React Native Android gate results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-gate-results-rn-android
          path: dist/verification/gate-results

  validate-docs:
    needs: validate-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Validate docs build
        run: make docs-build

  release-gates:
    runs-on: ubuntu-24.04
    outputs:
      publish_kotlin: ${{ steps.gates.outputs.publish_kotlin }}
      publish_npm: ${{ steps.gates.outputs.publish_npm }}
    steps:
      - name: Block uncertified v0.3 publication
        if: startsWith(github.ref, 'refs/tags/v0.3.')
        run: |
          echo "v0.3 publication is disabled until immutable RC evidence and exact-artifact promotion are implemented."
          exit 1

      - id: gates
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_CENTRAL_PASSWORD" ] && [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "publish_kotlin=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_kotlin=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$NPM_TOKEN" ]; then
            echo "publish_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_npm=false" >> "$GITHUB_OUTPUT"
          fi

  build-adapter-binaries:
    needs:
      - validate-quality
      - validate-server
      - validate-swift
      - validate-rn-ios
      - validate-kotlin
      - validate-rn-android
      - validate-docs
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod

      - name: Build Go release binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          cd api/go
          GOWORK=off go build -ldflags="-s -w" -o "../../dist/synchrod-pg-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/synchrod-pg
          GOWORK=off go build -ldflags="-s -w" -o "../../dist/synchro-seed-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/synchro-seed

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: go-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/synchrod-pg-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/synchro-seed-${{ matrix.goos }}-${{ matrix.goarch }}

  package-extension:
    needs: validate-server
    strategy:
      matrix:
        include:
          # SUP-PG-MACOS-ARM64-001 is excluded from v0.3.0 certification.
          # PostgreSQL servers deploy on Linux, so only the linux-x64
          # extension artifact is packaged and published.
          - os: ubuntu-24.04
            extension_architecture: linux-x64
            expected_runner_arch: X64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact

      - name: Install the certified PostgreSQL 18.3
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" | sudo tee /etc/apt/sources.list.d/pgdg-archive.list
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades             postgresql-18=18.3-1.pgdg24.04+1             postgresql-client-18=18.3-1.pgdg24.04+1             postgresql-server-dev-18=18.3-1.pgdg24.04+1
          # pgrx installs the extension into the server directories during
          # tests, and the apt installation is root owned.
          sudo chmod -R a+w "$(/usr/lib/postgresql/18/bin/pg_config --sharedir)/extension" "$(/usr/lib/postgresql/18/bin/pg_config --pkglibdir)"
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config
          echo "PGRX_PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config" >> "$GITHUB_ENV"

      - name: Validate PG 18 extension architecture
        run: |
          if [ "$RUNNER_ARCH" != "${{ matrix.expected_runner_arch }}" ]; then
            printf '%s\n' "Runner architecture $RUNNER_ARCH does not match expected architecture ${{ matrix.expected_runner_arch }}" >&2
            exit 1
          fi
          make test-rust-pg PGRX_PG_CONFIG="$PGRX_PG_CONFIG"

      - name: Package PG 18 extension
        run: |
          make conformance-pg18-extension-artifact PGRX_PG_CONFIG="$PGRX_PG_CONFIG"
          tar -C dist/conformance -czf "dist/synchro-pg-pg18-${{ matrix.extension_architecture }}.tar.gz" synchro-pg-pg18

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: synchro-pg-pg18-${{ matrix.extension_architecture }}
          path: dist/synchro-pg-pg18-${{ matrix.extension_architecture }}.tar.gz

  publish-kotlin:
    needs: [validate-kotlin, release-gates]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release-gates.outputs.publish_kotlin == 'true' }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish Kotlin package
        working-directory: clients/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAndReleaseToMavenCentral

  publish-npm:
    needs: [validate-quality, validate-rn-ios, validate-rn-android, release-gates]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release-gates.outputs.publish_npm == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - name: Install and build React Native package
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable
          yarn prepare

      - name: Publish React Native package
        working-directory: clients/react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  create-release:
    needs: [build-adapter-binaries, package-extension, release-gates]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    env:
      BLACKBOX_TEST_COUNT: '1'
      DETOX_ARGS: ${{ vars.DETOX_ARGS }}
      GO_TEST_ARGS: '-v -count=1 -p 1'
      GO_TEST_PKGS: './...'
      GRADLE_TEST_ARGS: '--rerun-tasks'
      KOTLIN_ANDROID_SERIAL: ${{ vars.KOTLIN_ANDROID_SERIAL }}
      MUTATION_CONTROL_EXPECT: 'target_pass'
      MUTATION_CONTROL_TEST: ${{ vars.MUTATION_CONTROL_TEST }}
      PGRX_TEST_NAME: ${{ vars.PGRX_TEST_NAME }}
      RN_ANDROID_DETOX_CONFIG: 'android.emu.release'
      SUPPORT_CELL_ID: ${{ vars.SUPPORT_CELL_ID }}
      SUPPORT_PLATFORM_VERSION: ${{ vars.SUPPORT_PLATFORM_VERSION }}
      TESTRESULT_TEST_NAME: ${{ vars.TESTRESULT_TEST_NAME }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Assemble terminal CI facts
        run: |
          mkdir -p dist/verification
          mkdir -p artifacts/gate-results
          find artifacts -type f -path '*/gate-results/*.json' -exec cp '{}' artifacts/gate-results/ \;
          scripts/ci/build-phase-5-input.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --results-dir artifacts/gate-results \
            --artifact-root artifacts \
            --output dist/verification/phase-5-input.json

      - name: Generate and validate Phase 5 CI summary
        run: make evidence

      - name: Confirm generated Phase 5 CI summary
        run: test -s dist/verification/phase-5-summary.json

      - name: Publish Phase 5 CI summary
        uses: actions/upload-artifact@v7.0.0
        with:
          name: phase-5-ci-summary
          path: dist/verification/phase-5-summary.json

      - name: Generate checksums
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS.txt
