name: Release

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Earlier Release run that owns the sealed candidate artifact.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOWORK: 'off'
  POSTGRESQL_VERSION: '18.3'
  PGRX_VERSION: '0.17.0'
  RUST_TOOLCHAIN: '1.92.0'
  SEALED_ARTIFACT_NAME: sealed-release

jobs:
  candidate:
    name: resolve immutable candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      version: ${{ steps.resolve.outputs.version }}
      candidate_ci_run_id: ${{ steps.resolve.outputs.candidate_ci_run_id }}
      candidate_ci_run_attempt: ${{ steps.resolve.outputs.candidate_ci_run_attempt }}
      artifact_run_id: ${{ steps.resolve.outputs.artifact_run_id }}
      release_dir_name: ${{ steps.resolve.outputs.release_dir_name }}
    steps:
      - name: Require dispatch from dev
        run: test "$GITHUB_REF" = refs/heads/dev

      - name: Checkout dispatch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download recovery candidate
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          case "$RESUME_RUN_ID" in ''|*[!0-9]*|0) echo "resume_run_id must be a positive run ID" >&2; exit 1 ;; esac
          test "$RESUME_RUN_ID" != "$GITHUB_RUN_ID"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID")"
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            '.path == ".github/workflows/release.yml" and .event == "workflow_dispatch" and .status == "completed" and .head_repository.full_name == $repository' \
            <<<"$run_json" >/dev/null || { echo "recovery requires a completed Release workflow run" >&2; exit 1; }
          resume_run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/artifacts?per_page=100")"
          count="$(jq --arg name "$SEALED_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts")"
          test "$count" = 1 || { echo "recovery requires one unexpired sealed-release artifact" >&2; exit 1; }
          receipt_count="$(jq '[.artifacts[] | select(.name == "publication-sealed-candidate" and .expired == false)] | length' <<<"$artifacts")"
          test "$receipt_count" = 1 || { echo "recovery requires the sealed candidate receipt" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/recovery"
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SEALED_ARTIFACT_NAME" --dir "$RUNNER_TEMP/recovery"
          mkdir -p "$RUNNER_TEMP/recovery-receipt"
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name publication-sealed-candidate --dir "$RUNNER_TEMP/recovery-receipt"
          test -f "$RUNNER_TEMP/recovery/release-manifest.json"
          test -f "$RUNNER_TEMP/recovery-receipt/sealed-release-receipt.json"
          sealed_id="$(jq -r --arg name "$SEALED_ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$artifacts")"
          sealed_digest="$(jq -r --arg name "$SEALED_ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .digest' <<<"$artifacts")"
          jq -e --arg id "$sealed_id" --arg digest "$sealed_digest" --arg run "$RESUME_RUN_ID" --arg attempt "$resume_run_attempt" \
            '.artifact_id == $id and .artifact_digest == $digest and .run_id == $run and .run_attempt == $attempt and (.expires_at | fromdateiso8601) > now' \
            "$RUNNER_TEMP/recovery-receipt/sealed-release-receipt.json" >/dev/null

      - name: Resolve and verify candidate identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$RESUME_RUN_ID" ]; then
            mode=recovery
            source_commit="$(jq -r '.source.commit' "$RUNNER_TEMP/recovery/release-manifest.json")"
            version="$(jq -r '.release_version' "$RUNNER_TEMP/recovery/release-manifest.json")"
            build_run_id="$(jq -r '.build.run_id' "$RUNNER_TEMP/recovery/release-manifest.json")"
            test "$build_run_id" = "$RESUME_RUN_ID" || { echo "sealed candidate belongs to another Release run" >&2; exit 1; }
            artifact_run_id="$RESUME_RUN_ID"
          else
            mode=normal
            git fetch --no-tags origin dev
            source_commit="$(git rev-parse --verify HEAD)"
            test "$source_commit" = "$(git rev-parse --verify origin/dev)" || { echo "normal release must select the current dev head" >&2; exit 1; }
            version="$(tr -d '\n' < VERSION)"
            artifact_run_id="$GITHUB_RUN_ID"
          fi
          case "$source_commit" in [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) echo "candidate source commit is invalid" >&2; exit 1 ;; esac
          case "$version" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "VERSION must match X.Y.Z" >&2; exit 1 ;; esac
          git checkout --detach "$source_commit"
          test "$(tr -d '\n' < VERSION)" = "$version"
          make version-check

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=dev&event=push&status=completed&head_sha=$source_commit&per_page=100")"
          candidate="$(jq -c --arg sha "$source_commit" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.run_attempt) | last // empty' <<<"$runs")"
          test -n "$candidate" || { echo "exact candidate commit has no successful completed CI push run" >&2; exit 1; }
          candidate_ci_run_id="$(jq -r '.id' <<<"$candidate")"
          candidate_ci_run_attempt="$(jq -r '.run_attempt' <<<"$candidate")"

          milestones="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" | jq 'add')"
          milestone_count="$(jq --arg title "v$version" '[.[] | select(.title == $title)] | length' <<<"$milestones")"
          test "$milestone_count" = 1 || { echo "one matching release milestone is required" >&2; exit 1; }
          open_issues="$(jq --arg title "v$version" '[.[] | select(.title == $title)][0].open_issues' <<<"$milestones")"
          test "$open_issues" = 0 || { echo "release milestone contains open issues" >&2; exit 1; }

          release_dir_name="release-$version-$source_commit"
          if [ "$mode" = recovery ]; then
            mv "$RUNNER_TEMP/recovery" "$RUNNER_TEMP/$release_dir_name"
            make release-verify VERSION="$version" RELEASE_DIR="$RUNNER_TEMP/$release_dir_name"
            GITHUB_TOKEN="$GH_TOKEN" python3 scripts/release-publish.py observe-public \
              --release-dir "$RUNNER_TEMP/$release_dir_name" \
              --output "$RUNNER_TEMP/recovery-public-state.json"
          else
            for tag in "v$version" "api/go/v$version"; do
              test -z "$(git ls-remote --tags origin "refs/tags/$tag")" || { echo "source tag already exists: $tag" >&2; exit 1; }
            done
            github_error="$RUNNER_TEMP/github-release-error"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" >/dev/null 2>"$github_error"; then
              echo "GitHub release version already exists" >&2
              exit 1
            else
              grep -F 'HTTP 404' "$github_error" >/dev/null || { echo "GitHub release query failed" >&2; exit 1; }
            fi
            curl --fail --silent --show-error \
              https://registry.npmjs.org/@trainstar%2fsynchro-react-native \
              --output "$RUNNER_TEMP/npm-package.json"
            jq -e --arg version "$version" '.versions[$version] == null' \
              "$RUNNER_TEMP/npm-package.json" >/dev/null || { echo "npm version already exists" >&2; exit 1; }
            maven_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://repo1.maven.org/maven2/fit/trainstar/synchro/$version/synchro-$version.pom")"
            test "$maven_status" = 404 || { echo "Maven version exists or repository query failed: HTTP $maven_status" >&2; exit 1; }
          fi
          {
            echo "mode=$mode"
            echo "source_commit=$source_commit"
            echo "version=$version"
            echo "candidate_ci_run_id=$candidate_ci_run_id"
            echo "candidate_ci_run_attempt=$candidate_ci_run_attempt"
            echo "artifact_run_id=$artifact_run_id"
            echo "release_dir_name=$release_dir_name"
          } >> "$GITHUB_OUTPUT"

  build-server:
    name: build sealed Linux components
    if: needs.candidate.outputs.mode == 'normal'
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PGRX_TARGET_DIR: ${{ github.workspace }}/.pgrx-target
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - name: Install certified PostgreSQL build runtime
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" | sudo tee /etc/apt/sources.list.d/pgdg-archive.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades \
            build-essential clang flex bison libclang-dev libreadline-dev libssl-dev libxml2-dev libxml2-utils libxslt-dev pkg-config xsltproc zlib1g-dev \
            postgresql-18=18.3-1.pgdg24.04+1 postgresql-client-18=18.3-1.pgdg24.04+1 postgresql-server-dev-18=18.3-1.pgdg24.04+1
          sudo chmod -R a+w "$(/usr/lib/postgresql/18/bin/pg_config --sharedir)/extension" "$(/usr/lib/postgresql/18/bin/pg_config --pkglibdir)"
          cargo install --locked cargo-pgrx --version "$PGRX_VERSION"
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Build exact server payloads and provisioner
        run: |
          make release-stage-server VERSION="${{ needs.candidate.outputs.version }}" PGRX_PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          make build-local-postgres LOCAL_POSTGRES_BINARY=dist/release-provisioner/synchro-local-postgres

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-server-components
          path: dist/release-components/server
          if-no-files-found: error

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-provisioner
          path: dist/release-provisioner/synchro-local-postgres
          if-no-files-found: error
          retention-days: 90

  build-packages:
    name: build signed package payloads
    if: needs.candidate.outputs.mode == 'normal'
    needs: candidate
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - id: java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Export Android Java home
        run: echo "ANDROID_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Android build components
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || { statuses=("${PIPESTATUS[@]}"); test "${statuses[1]}" = 0; }
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Build exact signed Maven bundle and npm tarball
        run: |
          set -euo pipefail
          test -n "$DOPPLER_TOKEN" || { echo "DOPPLER_TOKEN is required" >&2; exit 1; }
          cat > "$RUNNER_TEMP/build-packages.sh" <<'SCRIPT'
          #!/bin/sh
          set -eu
          : "${MAVEN_CENTRAL_USERNAME:?MAVEN_CENTRAL_USERNAME is required}"
          : "${MAVEN_CENTRAL_PASSWORD:?MAVEN_CENTRAL_PASSWORD is required}"
          : "${GPG_PRIVATE_KEY:?GPG_PRIVATE_KEY is required}"
          : "${GPG_PASSPHRASE:?GPG_PASSPHRASE is required}"
          export ORG_GRADLE_PROJECT_mavenCentralUsername="$MAVEN_CENTRAL_USERNAME"
          export ORG_GRADLE_PROJECT_mavenCentralPassword="$MAVEN_CENTRAL_PASSWORD"
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$GPG_PRIVATE_KEY"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$GPG_PASSPHRASE"
          make release-stage-packages VERSION="$RELEASE_VERSION"
          SCRIPT
          chmod 700 "$RUNNER_TEMP/build-packages.sh"
          RELEASE_VERSION="${{ needs.candidate.outputs.version }}" \
            doppler run --project synchro --config ci --command "$RUNNER_TEMP/build-packages.sh"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-package-components
          path: dist/release-components/packages
          if-no-files-found: error

  seal:
    name: seal or restore candidate
    if: ${{ always() && needs.candidate.result == 'success' && (needs.candidate.outputs.mode == 'recovery' || (needs.build-server.result == 'success' && needs.build-packages.result == 'success')) }}
    needs: [candidate, build-server, build-packages]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_run_id: ${{ needs.candidate.outputs.artifact_run_id }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - name: Download server components
        if: needs.candidate.outputs.mode == 'normal'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server-components
          path: dist/release-components/server

      - name: Download package components
        if: needs.candidate.outputs.mode == 'normal'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-components
          path: dist/release-components/packages

      - name: Restore sealed candidate
        if: needs.candidate.outputs.mode == 'recovery'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-release
          run-id: ${{ needs.candidate.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}

      - name: Write exact support resolution
        if: needs.candidate.outputs.mode == 'normal'
        run: |
          mkdir -p dist/release-inputs
          python3 - <<'PY'
          import json
          from pathlib import Path
          cells = [
              {"id": "SUP-PG-LINUX-X64-001", "environment": {"architecture": "x86_64", "os": "ubuntu-24.04", "postgresql": "18.3"}},
              {"id": "SUP-IOS-MIN-001", "environment": {"ios": "16.4", "swift": "6.0", "xcode": "16.4"}},
              {"id": "SUP-IOS-CURRENT-001", "environment": {"ios": "26.6", "xcode": "26.6"}},
              {"id": "SUP-ANDROID-MIN-001", "environment": {"android_api": "24", "os": "ubuntu-24.04"}},
              {"id": "SUP-ANDROID-CURRENT-001", "environment": {"android_api": "36", "os": "ubuntu-24.04"}},
              {"id": "SUP-RN-IOS-CURRENT-001", "environment": {"ios": "26.6", "react_native": "0.83.0", "xcode": "26.6"}},
              {"id": "SUP-RN-ANDROID-CURRENT-001", "environment": {"android_api": "36", "os": "ubuntu-24.04", "react_native": "0.83.0"}},
          ]
          Path("dist/release-inputs/support-environments.json").write_text(json.dumps(cells, indent=2, sort_keys=True) + "\n")
          PY

      - name: Generate SPDX JSON SBOM
        if: needs.candidate.outputs.mode == 'normal'
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        env:
          SYFT_FILE_METADATA_SELECTION: all
        with:
          path: dist/release-components
          format: spdx-json
          output-file: dist/release-inputs/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.33.0

      - name: Assemble and verify sealed release
        if: needs.candidate.outputs.mode == 'normal'
        run: |
          make release-stage \
            VERSION="${{ needs.candidate.outputs.version }}" \
            RELEASE_DIR="dist/releases/${{ needs.candidate.outputs.release_dir_name }}" \
            RELEASE_SBOM=dist/release-inputs/sbom.spdx.json \
            RELEASE_SUPPORT_ENVIRONMENTS=dist/release-inputs/support-environments.json \
            RELEASE_CANDIDATE_CI_RUN_ID="${{ needs.candidate.outputs.candidate_ci_run_id }}" \
            RELEASE_CANDIDATE_CI_RUN_ATTEMPT="${{ needs.candidate.outputs.candidate_ci_run_attempt }}"

      - name: Verify sealed release
        run: make release-verify VERSION="${{ needs.candidate.outputs.version }}" RELEASE_DIR="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"

      - name: Attest sealed file subjects
        if: needs.candidate.outputs.mode == 'normal'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/releases/${{ needs.candidate.outputs.release_dir_name }}/SHA256SUMS

      - name: Upload sealed release
        if: needs.candidate.outputs.mode == 'normal'
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sealed-release
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record sealed artifact identity
        if: needs.candidate.outputs.mode == 'normal'
        run: |
          expires_at="$(date -u -d '+90 days' '+%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg artifact_id '${{ steps.upload.outputs.artifact-id }}' \
            --arg artifact_digest '${{ steps.upload.outputs.artifact-digest }}' \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg expires_at "$expires_at" \
            '{artifact_id:$artifact_id, artifact_digest:$artifact_digest, run_id:$run_id, run_attempt:$run_attempt, expires_at:$expires_at}' \
            > "$RUNNER_TEMP/sealed-release-receipt.json"

      - name: Persist sealed artifact receipt
        if: needs.candidate.outputs.mode == 'normal'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-sealed-candidate
          path: ${{ runner.temp }}/sealed-release-receipt.json
          if-no-files-found: error
          retention-days: 90

  package-server:
    name: package server Ubuntu 24.04 x64
    needs: [candidate, seal]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - name: Download sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-release
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}

      - name: Download provisioner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provisioner
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/release-provisioner

      - name: Install certified PostgreSQL runtime
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" | sudo tee /etc/apt/sources.list.d/pgdg-archive.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades postgresql-18=18.3-1.pgdg24.04+1 postgresql-client-18=18.3-1.pgdg24.04+1
          sudo chmod -R a+w "$(/usr/lib/postgresql/18/bin/pg_config --sharedir)/extension" "$(/usr/lib/postgresql/18/bin/pg_config --pkglibdir)"
          chmod 700 dist/release-provisioner/synchro-local-postgres

      - name: Run sealed server package cell
        run: |
          make release-run-support-cell \
            VERSION="${{ needs.candidate.outputs.version }}" \
            RELEASE_DIR="dist/releases/${{ needs.candidate.outputs.release_dir_name }}" \
            RELEASE_PG18_BIN_DIR=/usr/lib/postgresql/18/bin \
            RELEASE_PROVISIONER=dist/release-provisioner/synchro-local-postgres \
            RELEASE_EVIDENCE_DIR=dist/package-evidence \
            SUPPORT_CELL_ID=SUP-PG-LINUX-X64-001

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-evidence-server
          path: dist/package-evidence/cells
          if-no-files-found: error

  package-android:
    name: package ${{ matrix.cell }}
    needs: [candidate, seal]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: SUP-ANDROID-MIN-001
            api: 24
          - cell: SUP-ANDROID-CURRENT-001
            api: 36
          - cell: SUP-RN-ANDROID-CURRENT-001
            api: 36
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KOTLIN_ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - id: java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android build components
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || { statuses=("${PIPESTATUS[@]}"); test "${statuses[1]}" = 0; }
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Download sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-release
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}

      - name: Download provisioner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provisioner
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/release-provisioner

      - name: Install certified PostgreSQL runtime
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" | sudo tee /etc/apt/sources.list.d/pgdg-archive.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades postgresql-18=18.3-1.pgdg24.04+1 postgresql-client-18=18.3-1.pgdg24.04+1
          sudo chmod -R a+w "$(/usr/lib/postgresql/18/bin/pg_config --sharedir)/extension" "$(/usr/lib/postgresql/18/bin/pg_config --pkglibdir)"
          chmod 700 dist/release-provisioner/synchro-local-postgres

      - name: Start sealed Linux fixture
        run: |
          set -euo pipefail
          release="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          work="$RUNNER_TEMP/local-fixture"
          mkdir -m 700 "$work" "$work/unpacked" "$work/adapter"
          tar -xzf "$release/artifacts/synchro-pg-pg18-ubuntu24.04-linux-x64-${{ needs.candidate.outputs.version }}.tar.gz" -C "$work/unpacked"
          cp "$release/artifacts/synchrod-pg-linux-x64-${{ needs.candidate.outputs.version }}" "$work/adapter/synchrod-pg"
          shasum -a 256 "$work/adapter/synchrod-pg" | cut -d ' ' -f 1 > "$work/adapter/synchrod-pg.sha256"
          chmod 700 "$work/adapter/synchrod-pg"
          nohup dist/release-provisioner/synchro-local-postgres start \
            --pg18-bin-dir /usr/lib/postgresql/18/bin \
            --extension-artifact "$work/unpacked/extension" \
            --adapter-artifact "$work/adapter/synchrod-pg" \
            --state-dir "$work/state" --temp-parent "$work" \
            --url-file "$work/admin.url" --attach-environment-file "$work/attach.env" \
            > "$work/provisioner.log" 2>&1 &
          echo "$!" > "$work/provisioner.pid"
          for _ in $(seq 1 120); do test -f "$work/attach.env" && break; sleep 1; done
          test -f "$work/attach.env"
          SYNCHRO_ATTACH_DIR="$work/state"; export SYNCHRO_ATTACH_DIR
          set -a; . "$work/attach.env"; set +a
          admin_password="$(cat "$SYNCHRO_CONFORMANCE_ADMIN_PASSWORD_FILE")"
          adapter_password="$(cat "$SYNCHRO_CONFORMANCE_ADAPTER_PASSWORD_FILE")"
          admin_url="$(python3 - "$SYNCHRO_CONFORMANCE_ATTACH_DATABASE_URL" "$SYNCHRO_CONFORMANCE_ADMIN_USER" "$admin_password" <<'PY'
          import sys, urllib.parse
          value = urllib.parse.urlsplit(sys.argv[1])
          auth = urllib.parse.quote(sys.argv[2], safe="") + ":" + urllib.parse.quote(sys.argv[3], safe="")
          print(urllib.parse.urlunsplit((value.scheme, auth + "@" + value.netloc, value.path, value.query, "")))
          PY
          )"
          adapter_url="$(python3 - "$SYNCHRO_CONFORMANCE_ATTACH_DATABASE_URL" "$SYNCHRO_CONFORMANCE_ADAPTER_USER" "$adapter_password" <<'PY'
          import sys, urllib.parse
          value = urllib.parse.urlsplit(sys.argv[1])
          auth = urllib.parse.quote(sys.argv[2], safe="") + ":" + urllib.parse.quote(sys.argv[3], safe="")
          print(urllib.parse.urlunsplit((value.scheme, auth + "@" + value.netloc, value.path, value.query, "")))
          PY
          )"
          unset admin_password adapter_password
          DATABASE_URL="$admin_url" dist/release-provisioner/synchro-local-postgres prepare --repo-root "$GITHUB_WORKSPACE" --database-url "$admin_url"
          DATABASE_URL="$adapter_url" JWT_SECRET="$(cat "$SYNCHRO_CONFORMANCE_JWT_SECRET_FILE")" LISTEN_ADDR=127.0.0.1:8091 \
            nohup "$work/adapter/synchrod-pg" > "$work/adapter.log" 2>&1 &
          echo "$!" > "$work/adapter.pid"
          for _ in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8091/ready >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8091/ready >/dev/null
          jwt_secret="$(cat "$SYNCHRO_CONFORMANCE_JWT_SECRET_FILE")"
          echo "::add-mask::$jwt_secret"
          {
            echo "SYNCHRO_TEST_URL=http://127.0.0.1:8091"
            echo "SYNCHRO_TEST_JWT_SECRET=$jwt_secret"
            echo "ANDROID_JAVA_HOME=$JAVA_HOME"
          } >> "$GITHUB_ENV"

      - name: Run Android package cell
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: Synchro_Release_API_${{ matrix.api }}
          force-avd-creation: true
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: make release-run-support-cell VERSION="${{ needs.candidate.outputs.version }}" RELEASE_DIR="dist/releases/${{ needs.candidate.outputs.release_dir_name }}" RELEASE_EVIDENCE_DIR="dist/package-evidence" RELEASE_CONSUMER_DIR="dist/release-consumer" SUPPORT_CELL_ID="${{ matrix.cell }}" SUPPORT_PLATFORM_VERSION="${{ matrix.api }}"

      - name: Stop local fixture
        if: always()
        run: |
          work="$RUNNER_TEMP/local-fixture"
          if [ -f "$work/adapter.pid" ]; then kill "$(cat "$work/adapter.pid")" >/dev/null 2>&1 || true; fi
          if [ -f "$work/attach.env" ]; then
            SYNCHRO_ATTACH_DIR="$work/state"; export SYNCHRO_ATTACH_DIR
            . "$work/attach.env"
            dist/release-provisioner/synchro-local-postgres lifecycle --state-dir "$work/state" destroy "$SYNCHRO_CONFORMANCE_ATTACH_RUN_ID" >/dev/null 2>&1 || true
          fi

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: package-evidence-${{ matrix.cell }}
          path: dist/package-evidence/cells
          if-no-files-found: error

  package-apple:
    name: package ${{ matrix.cell }}
    needs: [candidate, seal]
    runs-on: ${{ matrix.runner }}
    environment: release-fixtures
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: SUP-IOS-MIN-001
            ios: '16.4'
            support: '16'
            xcode: '16.4'
            runner: macos-15
          - cell: SUP-IOS-CURRENT-001
            ios: '26.6'
            support: '26.6'
            xcode: '26.6'
            runner: macos-26
          - cell: SUP-RN-IOS-CURRENT-001
            ios: '26.6'
            support: '26.6'
            xcode: '26.6'
            runner: macos-26
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Download sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-release
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}

      - name: Download provisioner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provisioner
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/release-provisioner

      - name: Select required Xcode and simulator
        env:
          IOS_VERSION: ${{ matrix.ios }}
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          set -euo pipefail
          test -d "/Applications/Xcode_$XCODE_VERSION.app" || { echo "Xcode $XCODE_VERSION is required" >&2; exit 1; }
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$XCODE_VERSION"
          swift --version | grep -E 'Swift version 6[.]' >/dev/null
          if ! xcrun simctl list runtimes available -j | ruby -rjson -e 'wanted=ARGV.fetch(0); exit(JSON.parse(STDIN.read).fetch("runtimes").any? { |r| r["version"] == wanted } ? 0 : 1)' "$IOS_VERSION"; then
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION"
          fi
          runtime="$(xcrun simctl list runtimes available -j | ruby -rjson -e 'wanted=ARGV.fetch(0); r=JSON.parse(STDIN.read).fetch("runtimes").find { |x| x["version"] == wanted }; abort "required iOS runtime is unavailable" unless r; puts r.fetch("identifier")' "$IOS_VERSION")"
          device="$(xcrun simctl list devicetypes -j | ruby -rjson -e 'd=JSON.parse(STDIN.read).fetch("devicetypes"); x=d.find { |i| i["name"] == "iPhone 14" } || d.find { |i| i["name"].start_with?("iPhone") }; abort "no iPhone simulator type" unless x; puts x.fetch("identifier")')"
          udid="$(xcrun simctl create "Synchro_${{ matrix.cell }}" "$device" "$runtime")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Configure fixture SSH identity
        env:
          FIXTURE_KEY: ${{ secrets.RELEASE_FIXTURE_SSH_PRIVATE_KEY }}
          FIXTURE_KNOWN_HOSTS: ${{ secrets.RELEASE_FIXTURE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$FIXTURE_KEY" || { echo "RELEASE_FIXTURE_SSH_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "$FIXTURE_KNOWN_HOSTS" || { echo "RELEASE_FIXTURE_SSH_KNOWN_HOSTS is required" >&2; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/release-fixture-key"
          install -m 600 /dev/null "$RUNNER_TEMP/release-fixture-known-hosts"
          printf '%s\n' "$FIXTURE_KEY" > "$RUNNER_TEMP/release-fixture-key"
          printf '%s\n' "$FIXTURE_KNOWN_HOSTS" > "$RUNNER_TEMP/release-fixture-known-hosts"
          chmod 700 dist/release-provisioner/synchro-local-postgres scripts/ci/release-linux-fixture.sh

      - name: Run Apple package cell through Linux fixture
        env:
          FIXTURE_HOST: ${{ secrets.RELEASE_FIXTURE_SSH_HOST }}
          FIXTURE_USER: ${{ secrets.RELEASE_FIXTURE_SSH_USER }}
          FIXTURE_ROOT: ${{ secrets.RELEASE_FIXTURE_REMOTE_ROOT }}
          FIXTURE_PG18_BIN_DIR: ${{ secrets.RELEASE_FIXTURE_PG18_BIN_DIR }}
          RELEASE_FIXTURE_CELL_ID: ${{ matrix.cell }}
        run: |
          set -euo pipefail
          : "${FIXTURE_HOST:?RELEASE_FIXTURE_SSH_HOST is required}"
          : "${FIXTURE_USER:?RELEASE_FIXTURE_SSH_USER is required}"
          : "${FIXTURE_ROOT:?RELEASE_FIXTURE_REMOTE_ROOT is required}"
          : "${FIXTURE_PG18_BIN_DIR:?RELEASE_FIXTURE_PG18_BIN_DIR is required}"
          scripts/ci/release-linux-fixture.sh \
            --known-hosts "$RUNNER_TEMP/release-fixture-known-hosts" \
            --key "$RUNNER_TEMP/release-fixture-key" \
            --user "$FIXTURE_USER" --host "$FIXTURE_HOST" \
            --remote-root "$FIXTURE_ROOT" --pg18-bin-dir "$FIXTURE_PG18_BIN_DIR" \
            --release-dir "dist/releases/${{ needs.candidate.outputs.release_dir_name }}" \
            --version "${{ needs.candidate.outputs.version }}" \
            --provisioner "dist/release-provisioner/synchro-local-postgres" \
            --cell "${{ matrix.cell }}" -- \
            make release-run-support-cell \
              VERSION="${{ needs.candidate.outputs.version }}" \
              RELEASE_DIR="dist/releases/${{ needs.candidate.outputs.release_dir_name }}" \
              RELEASE_EVIDENCE_DIR="dist/package-evidence" \
              RELEASE_CONSUMER_DIR="dist/release-consumer" \
              SUPPORT_CELL_ID="${{ matrix.cell }}" \
              SUPPORT_PLATFORM_VERSION="${{ matrix.support }}"

      - name: Delete simulator
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: package-evidence-${{ matrix.cell }}
          path: dist/package-evidence/cells
          if-no-files-found: error

  package-gate:
    name: package gate
    if: always()
    needs: [candidate, seal, package-server, package-android, package-apple]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require package jobs
        run: |
          test "${{ needs.candidate.result }}" = success
          test "${{ needs.seal.result }}" = success
          test "${{ needs.package-server.result }}" = success
          test "${{ needs.package-android.result }}" = success
          test "${{ needs.package-apple.result }}" = success

      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}

      - name: Download sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-release
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}

      - name: Download package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-evidence-*
          path: dist/package-evidence/cells
          merge-multiple: true

      - name: Aggregate exact support obligations
        run: |
          make release-verify VERSION="${{ needs.candidate.outputs.version }}" RELEASE_DIR="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          python3 verification/packaged_smoke.py collect \
            --repo-root "$GITHUB_WORKSPACE" \
            --cells-dir dist/package-evidence/cells \
            --output dist/package-evidence/summary.json
          jq -e '.status == "passed" and ([.obligations[].id | split("/")[1]] | unique | length) == 7 and (.obligations | length) == 35 and all(.obligations[]; .status == "passed" and .terminal == true and .test_count > 0)' dist/package-evidence/summary.json >/dev/null

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-gate-evidence
          path: dist/package-evidence/summary.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: approve, publish, verify, and promote
    needs: [candidate, seal, package-gate]
    runs-on: macos-26
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
      issues: read
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      ANDROID_HOME: /Users/runner/Library/Android/sdk
      ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.source_commit }}
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - id: java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Export Android Java home
        run: echo "ANDROID_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Download exact sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-release
          run-id: ${{ needs.seal.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/releases/${{ needs.candidate.outputs.release_dir_name }}

      - name: Recheck approved candidate and credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          version="${{ needs.candidate.outputs.version }}"
          commit="${{ needs.candidate.outputs.source_commit }}"
          test "$(git rev-parse HEAD)" = "$commit"
          test "$(tr -d '\n' < VERSION)" = "$version"
          make version-check
          make release-verify VERSION="$version" RELEASE_DIR="$release"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=dev&event=push&status=completed&head_sha=$commit&per_page=100")"
          jq -e --arg sha "$commit" --argjson id '${{ needs.candidate.outputs.candidate_ci_run_id }}' --argjson attempt '${{ needs.candidate.outputs.candidate_ci_run_attempt }}' \
            'any(.workflow_runs[]; .head_sha == $sha and .id == $id and .run_attempt == $attempt and .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null
          milestones="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" | jq 'add')"
          jq -e --arg title "v$version" '([.[] | select(.title == $title)] | length) == 1 and ([.[] | select(.title == $title)][0].open_issues == 0)' <<<"$milestones" >/dev/null
          GITHUB_TOKEN="$GH_TOKEN" python3 scripts/release-publish.py observe-public --release-dir "$release" --output "$RUNNER_TEMP/public-before.json"
          test -n "$DOPPLER_TOKEN" || { echo "DOPPLER_TOKEN is required" >&2; exit 1; }
          cat > "$RUNNER_TEMP/check-release-secrets.sh" <<'SCRIPT'
          #!/bin/sh
          set -eu
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_PASSPHRASE"
          SCRIPT
          chmod 700 "$RUNNER_TEMP/check-release-secrets.sh"
          doppler run --project synchro --config ci --command "$RUNNER_TEMP/check-release-secrets.sh"
          while read -r digest relative; do
            gh attestation verify "$release/$relative" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$commit" >/dev/null
            test "$(shasum -a 256 "$release/$relative" | cut -d ' ' -f 1)" = "$digest"
          done < "$release/SHA256SUMS"

      - name: Create or verify immutable source tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="${{ needs.candidate.outputs.source_commit }}"
          version="${{ needs.candidate.outputs.version }}"
          for tag in "v$version" "api/go/v$version"; do
            remote="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
            if [ -n "$remote" ]; then
              test "$remote" = "$commit" || { echo "tag source mismatch: $tag" >&2; exit 1; }
            else
              git tag "$tag" "$commit"
              git push origin "refs/tags/$tag"
            fi
          done

      - name: Create or recover draft and publish GitHub assets
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          tag="v${{ needs.candidate.outputs.version }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --latest=false
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          test -n "$release_id"
          for path in "$release/release-manifest.json" "$release/SHA256SUMS" "$release/sbom.spdx.json" "$release"/artifacts/*; do
            name="$(basename "$path")"
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            if [ "$count" = 0 ]; then
              gh release upload "$tag" "$path" --repo "$GITHUB_REPOSITORY"
            elif [ "$count" = 1 ]; then
              mkdir -p "$RUNNER_TEMP/github-existing"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/github-existing"
              test "$(shasum -a 256 "$RUNNER_TEMP/github-existing/$name" | cut -d ' ' -f 1)" = "$(shasum -a 256 "$path" | cut -d ' ' -f 1)" || { echo "GitHub asset byte mismatch: $name" >&2; exit 1; }
            else
              echo "GitHub release repeats asset: $name" >&2
              exit 1
            fi
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          jq -n --arg release_id "$release_id" --arg tag "$tag" --arg commit '${{ needs.candidate.outputs.source_commit }}' '{release_id:$release_id,tag:$tag,source_commit:$commit}' > "$RUNNER_TEMP/github-operation.json"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-github
          path: ${{ runner.temp }}/github-operation.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify anonymous GitHub and source consumers
        env:
          GITHUB_TOKEN: ''
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          release="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          version="${{ needs.candidate.outputs.version }}"
          expected_commit="${{ needs.candidate.outputs.source_commit }}"
          python3 scripts/release-publish.py observe-public --release-dir "$release" --output "$RUNNER_TEMP/public-github.json"
          SYNCHRO_GO_CONSUMER_MODE=public make test-consumer-go
          git clone --quiet --depth 1 --branch "v$version" https://github.com/trainstar/synchro.git "$RUNNER_TEMP/public-swift"
          test "$(git -C "$RUNNER_TEMP/public-swift" rev-parse HEAD)" = "$expected_commit"
          swift package --package-path "$RUNNER_TEMP/public-swift" --disable-dependency-cache resolve
          swift build --package-path "$RUNNER_TEMP/public-swift" --disable-dependency-cache
          command -v pod >/dev/null 2>&1 || sudo gem install cocoapods
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/trainstar/synchro/v$version/Synchro.podspec" \
            --output "$RUNNER_TEMP/Synchro.podspec"
          pod ipc spec "$RUNNER_TEMP/Synchro.podspec" >/dev/null

      - name: Resolve or upload and validate Maven deployment
        id: maven
        run: |
          set -euo pipefail
          release="$GITHUB_WORKSPACE/dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          identity="$RUNNER_TEMP/release-identity.json"
          python3 scripts/release-publish.py identity --release-dir "$release" --output "$identity"
          bundle="$release/$(jq -r '.maven_bundle.path' "$identity")"
          name="$(jq -r '.maven_bundle.deployment_name' "$identity")"
          doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-list --name $name --output $RUNNER_TEMP/central-list.json"
          python3 scripts/release-publish.py central-select --input "$RUNNER_TEMP/central-list.json" --name "$name" --output "$RUNNER_TEMP/central-selected.json"
          deployment_id="$(jq -r '.deployment_id // empty' "$RUNNER_TEMP/central-selected.json")"
          deployment_state="$(jq -r '.deployment_state // empty' "$RUNNER_TEMP/central-selected.json")"
          public_maven="$(jq -r '.maven' "$RUNNER_TEMP/public-github-classification.json")"
          if [ -n "$deployment_id" ] && { [ "$deployment_state" = PENDING ] || [ "$deployment_state" = VALIDATING ]; }; then
            for _ in $(seq 1 120); do
              doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-status --deployment-id $deployment_id --output $RUNNER_TEMP/central-status.json"
              deployment_state="$(jq -r '.deploymentState // .deployment_state // .state // empty' "$RUNNER_TEMP/central-status.json")"
              case "$deployment_state" in
                VALIDATED|FAILED|PUBLISHING|PUBLISHED) break ;;
                PENDING|VALIDATING) sleep 15 ;;
                *) echo "Central returned an unsupported deployment state" >&2; exit 1 ;;
              esac
            done
          fi
          if [ -n "$deployment_id" ] && { [ "$deployment_state" = VALIDATED ] || [ "$deployment_state" = FAILED ]; }; then
            doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-drop --deployment-id $deployment_id"
            deployment_id=
            deployment_state=
          fi
          if [ -z "$deployment_id" ]; then
            if [ "$public_maven" = published ]; then
              deployment_state=PUBLIC
            else
              doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-upload --bundle $bundle --name $name --output $RUNNER_TEMP/central-upload.json"
              deployment_id="$(jq -r '.deployment_id' "$RUNNER_TEMP/central-upload.json")"
              test -n "$deployment_id"
              deployment_state=PENDING
            fi
          fi
          jq -n --arg deployment_id "$deployment_id" --arg deployment_name "$name" --arg bundle_sha256 "$(shasum -a 256 "$bundle" | cut -d ' ' -f 1)" '{deployment_id:$deployment_id,deployment_name:$deployment_name,bundle_sha256:$bundle_sha256}' > "$RUNNER_TEMP/maven-operation.json"
          if [ "$deployment_state" = PENDING ] || [ "$deployment_state" = VALIDATING ]; then
            for _ in $(seq 1 120); do
              doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-status --deployment-id $deployment_id --output $RUNNER_TEMP/central-status.json"
              deployment_state="$(jq -r '.deploymentState // .deployment_state // .state // empty' "$RUNNER_TEMP/central-status.json")"
              case "$deployment_state" in
                VALIDATED|PUBLISHING|PUBLISHED) break ;;
                FAILED) echo "Central validation failed" >&2; exit 1 ;;
                PENDING|VALIDATING) sleep 15 ;;
                *) echo "Central returned an unsupported deployment state" >&2; exit 1 ;;
              esac
            done
          fi
          case "$deployment_state" in
            VALIDATED|PUBLISHING|PUBLISHED|PUBLIC) ;;
            *) echo "Central deployment did not reach a recoverable state" >&2; exit 1 ;;
          esac
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_state=$deployment_state" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-maven
          path: ${{ runner.temp }}/maven-operation.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish and verify Maven deployment
        env:
          DEPLOYMENT_ID: ${{ steps.maven.outputs.deployment_id }}
          DEPLOYMENT_STATE: ${{ steps.maven.outputs.deployment_state }}
        run: |
          set -euo pipefail
          release="$GITHUB_WORKSPACE/dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          deployment_state="$DEPLOYMENT_STATE"
          if [ "$deployment_state" = PUBLIC ]; then
            deployment_state=PUBLISHED
          fi
          if [ "$deployment_state" = VALIDATED ]; then
            doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-publish --deployment-id $DEPLOYMENT_ID"
          fi
          if [ "$deployment_state" != PUBLISHED ]; then
            for _ in $(seq 1 120); do
              doppler run --project synchro --config ci --command "python3 scripts/release-publish.py central-status --deployment-id $DEPLOYMENT_ID --output $RUNNER_TEMP/central-status.json"
              deployment_state="$(jq -r '.deploymentState // .deployment_state // .state // empty' "$RUNNER_TEMP/central-status.json")"
              case "$deployment_state" in
                PUBLISHED) break ;;
                FAILED) echo "Central publication failed" >&2; exit 1 ;;
                PUBLISHING|VALIDATED) sleep 15 ;;
                *) echo "Central returned an unsupported publication state" >&2; exit 1 ;;
              esac
            done
          fi
          test "$deployment_state" = PUBLISHED
          for _ in $(seq 1 120); do
            if env -u GITHUB_TOKEN python3 scripts/release-publish.py observe-public --release-dir "$release" --output "$RUNNER_TEMP/public-maven.json"; then
              [ "$(jq -r '.maven' "$RUNNER_TEMP/public-maven-classification.json")" = published ] && break
            fi
            sleep 15
          done
          test "$(jq -r '.maven' "$RUNNER_TEMP/public-maven-classification.json")" = published

      - name: Verify public Maven consumer
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || { statuses=("${PIPESTATUS[@]}"); test "${statuses[1]}" = 0; }
          "$sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          export SYNCHRO_CONSUMER_MAVEN_REPOSITORY=https://repo1.maven.org/maven2
          export JAVA_HOME="$ANDROID_JAVA_HOME"
          export PATH="$ANDROID_JAVA_HOME/bin:$PATH"
          clients/kotlin/gradlew --project-dir verification/consumers/kotlin --no-daemon \
            -PsynchroVersion="${{ needs.candidate.outputs.version }}" :app:assembleRelease

      - name: Publish or verify exact npm candidate
        env:
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          release="dist/releases/${{ needs.candidate.outputs.release_dir_name }}"
          version="${{ needs.candidate.outputs.version }}"
          tarball="$release/artifacts/trainstar-synchro-react-native-$version.tgz"
          npm install --global npm@11.6.2
          python3 scripts/release-publish.py observe-public --release-dir "$release" --output "$RUNNER_TEMP/public-before-npm.json"
          npm_state="$(jq -r '.npm' "$RUNNER_TEMP/public-before-npm-classification.json")"
          if [ "$npm_state" = absent ]; then
            npm publish "$tarball" --access public --provenance --tag candidate
          else
            test "$npm_state" = published-candidate || test "$npm_state" = published-latest
          fi
          for _ in $(seq 1 40); do
            if python3 scripts/release-publish.py observe-public --release-dir "$release" --output "$RUNNER_TEMP/public-npm.json"; then
              npm_state="$(jq -r '.npm' "$RUNNER_TEMP/public-npm-classification.json")"
              [ "$npm_state" != absent ] && break
            fi
            sleep 15
          done
          test "$npm_state" = published-candidate || test "$npm_state" = published-latest
          jq -n --arg package '@trainstar/synchro-react-native' --arg version "$version" --arg sha256 "$(shasum -a 256 "$tarball" | cut -d ' ' -f 1)" '{package:$package,version:$version,sha256:$sha256}' > "$RUNNER_TEMP/npm-operation.json"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: publication-npm
          path: ${{ runner.temp }}/npm-operation.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify public React Native iOS and Android consumers
        env:
          SYNCHRO_CONSUMER_RESOLUTION: public
          PACKAGED_SMOKE_TMP_ROOT: ${{ runner.temp }}/public-rn
          SUPPORT_PLATFORM_VERSION: '26.6'
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.6.app || { echo "Xcode 26.6 is required" >&2; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.6.app
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || { statuses=("${PIPESTATUS[@]}"); test "${statuses[1]}" = 0; }
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          mkdir -p "$RUNNER_TEMP/public-rn" "$RUNNER_TEMP/empty-artifacts"
          sh verification/consumers/react-native/test-consumer.sh ios "$RUNNER_TEMP/empty-artifacts" "${{ needs.candidate.outputs.version }}" build-only
          sh verification/consumers/react-native/test-consumer.sh android "$RUNNER_TEMP/empty-artifacts" "${{ needs.candidate.outputs.version }}" build-only

      - name: Promote npm and GitHub latest only after public checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.candidate.outputs.version }}"
          npm install --global npm@11.6.2
          npm dist-tag add "@trainstar/synchro-react-native@$version" latest
          if [ "$(npm view "@trainstar/synchro-react-native" dist-tags.candidate 2>/dev/null || true)" = "$version" ]; then
            npm dist-tag rm "@trainstar/synchro-react-native" candidate
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.github_release.outputs.release_id }}" -f make_latest=true >/dev/null
          env -u GITHUB_TOKEN python3 scripts/release-publish.py observe-public \
            --release-dir "dist/releases/${{ needs.candidate.outputs.release_dir_name }}" \
            --output "$RUNNER_TEMP/public-final.json"
          jq -e '.complete == true and .next_operation == "complete"' "$RUNNER_TEMP/public-final-classification.json" >/dev/null
