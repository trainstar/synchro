name: RC2 iOS minimum fixture diagnostic

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOWORK: 'off'
  POSTGRESQL_VERSION: '18.3'
  PGRX_VERSION: '0.17.0'
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  fixture:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 464ee2d5238a1da74f7dad5d3250f6b40586d30a
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5
      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew
      - uses: ./.github/actions/setup-conformance-pg18
      - name: Select the original Xcode and simulator tuple
        env:
          IOS_VERSION: '17.0'
          XCODE_VERSION: '27.0'
        run: |
          set -euo pipefail
          test -d "/Applications/Xcode_$XCODE_VERSION.app"
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$XCODE_VERSION"
          swift --version | grep -E 'Swift version 6[.]' >/dev/null
          if ! xcrun simctl list runtimes available -j | ruby -rjson -e 'wanted=ARGV.fetch(0); exit(JSON.parse(STDIN.read).fetch("runtimes").any? { |r| r["version"] == wanted } ? 0 : 1)' "$IOS_VERSION"; then
            umask 077
            runtime_dir="$(mktemp -d)"
            trap 'rm -rf "$runtime_dir"' EXIT
            curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --get --data-urlencode 'path=/Developer_Tools/iOS_17_Simulator_Runtime/iOS_17_Simulator_Runtime.dmg' \
              --cookie-jar "$runtime_dir/cookies" --output /dev/null \
              'https://developerservices2.apple.com/services/download'
            test -s "$runtime_dir/cookies"
            curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --cookie "$runtime_dir/cookies" --output "$runtime_dir/iOS_17_Simulator_Runtime.dmg" \
              'https://download.developer.apple.com/Developer_Tools/iOS_17_Simulator_Runtime/iOS_17_Simulator_Runtime.dmg'
            sudo xcodebuild -importPlatform "$runtime_dir/iOS_17_Simulator_Runtime.dmg"
          fi
          runtime="$(xcrun simctl list runtimes available -j | ruby -rjson -e 'wanted=ARGV.fetch(0); r=JSON.parse(STDIN.read).fetch("runtimes").find { |x| x["version"] == wanted }; abort "required iOS runtime is unavailable" unless r; puts r.fetch("identifier")' "$IOS_VERSION")"
          device="$(xcrun simctl list devicetypes -j | ruby -rjson -e 'd=JSON.parse(STDIN.read).fetch("devicetypes"); x=d.find { |i| i["name"] == "iPhone 14" } || d.find { |i| i["name"].start_with?("iPhone") }; abort "no iPhone simulator type" unless x; puts x.fetch("identifier")')"
          udid="$(xcrun simctl create Synchro_SUP-IOS-MIN-001 "$device" "$runtime")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Verify ownership controls on the matching host
        run: make test-ci-process-lifecycle
      - name: Run only the fixture start with the corrected query
        run: |
          set -euo pipefail
          make local-postgres-start
          attach="$GITHUB_WORKSPACE/.ignore/r2/tmp/local-postgres/attach.env"
          SYNCHRO_ATTACH_DIR="$(dirname "$attach")"
          export SYNCHRO_ATTACH_DIR
          set -a
          . "$attach"
          set +a
          ADAPTER_TEST_URL="$(cat .ignore/r2/tmp/local-postgres/postgres.url)"
          SYNCHRO_TEST_JWT_SECRET="$(cat "$SYNCHRO_CONFORMANCE_JWT_SECRET_FILE")"
          SYNCHRO_TEST_URL=http://127.0.0.1:8091
          WARM_CONNECT_ENV_FILE="$attach"
          export ADAPTER_TEST_URL SYNCHRO_TEST_JWT_SECRET SYNCHRO_TEST_URL WARM_CONNECT_ENV_FILE
          echo "::add-mask::$ADAPTER_TEST_URL"
          echo "::add-mask::$SYNCHRO_TEST_JWT_SECRET"
          {
            echo "ADAPTER_TEST_URL=$ADAPTER_TEST_URL"
            echo "SYNCHRO_TEST_JWT_SECRET=$SYNCHRO_TEST_JWT_SECRET"
            echo "SYNCHRO_TEST_URL=$SYNCHRO_TEST_URL"
            echo "WARM_CONNECT_ENV_FILE=$WARM_CONNECT_ENV_FILE"
          } >> "$GITHUB_ENV"
          SYNCHROD_PG_LOG_FILE="$RUNNER_TEMP/synchrod-pg-apple-startup.log"
          export SYNCHROD_PG_LOG_FILE
          if make synchrod-pg-test-start CLIENT_DATASET=1 SYNCHROD_PG_LOG_FILE="$SYNCHROD_PG_LOG_FILE"; then
            printf '%s\n' 0 > "$RUNNER_TEMP/fixture-start-status"
          else
            startup_status=$?
            printf '%s\n' "$startup_status" > "$RUNNER_TEMP/fixture-start-status"
            if ! python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          from urllib.parse import quote

          try:
              diagnostic = Path(os.environ["SYNCHROD_PG_LOG_FILE"]).read_text(encoding="utf-8")
              secrets = {os.environ["ADAPTER_TEST_URL"], os.environ["SYNCHRO_TEST_JWT_SECRET"]}
              if "" in secrets:
                  raise ValueError("A required diagnostic secret is empty.")
              for role in ("ADMIN", "ADAPTER", "OBSERVER", "WORKER", "OPERATOR"):
                  secret = Path(os.environ[f"SYNCHRO_CONFORMANCE_{role}_PASSWORD_FILE"]).read_text(encoding="utf-8").strip()
                  if secret:
                      secrets.add(secret)
              redactions = {value for secret in secrets for value in (secret, quote(secret, safe=""))}
              for value in sorted(redactions, key=len, reverse=True):
                  diagnostic = diagnostic.replace(value, "[REDACTED]")
              diagnostic = diagnostic[-16384:]
          except Exception:
              diagnostic = "Apple fixture diagnostic unavailable.\n"
          sys.stderr.write(diagnostic)
          PY
            then
              printf '%s\n' 'Apple fixture diagnostic unavailable.' >&2 || true
            fi
            exit "$startup_status"
          fi
      - name: Record safe startup error classes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'synchrod-pg-apple-startup.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          source = pathlib.Path('scripts/ci/adapter_process.py').read_text()
          known = re.findall(r'raise RuntimeError\("([^"\n]+)"\)', source)
          classes = sorted({message for message in known if message in text})
          stages = [stage for stage in ['opening database', 'pinging database', 'verifying synchro_pg compatibility', 'DATABASE_URL is required', 'listening'] if stage in text]
          status_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fixture-start-status'
          result = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'fixture_start_exit_code': int(status_path.read_text()) if status_path.exists() else None,
              'adapter_log_present': log.exists(),
              'adapter_log_bytes': len(text.encode()),
              'adapter_log_sha256': hashlib.sha256(text.encode()).hexdigest(),
              'owner_error_classes': classes,
              'adapter_stages': stages,
              'errno_codes': sorted(set(re.findall(r'\[Errno (\d+)\]', text))),
              'sqlstate_codes': sorted(set(re.findall(r'SQLSTATE ([A-Z0-9]{5})', text))),
              'exception_types': sorted(set(re.findall(r'^([A-Za-z][A-Za-z0-9_.]*(?:Error|Exception)):', text, re.MULTILINE))),
          }
          out = pathlib.Path('dist/fixture-diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'startup.json').write_text(json.dumps(result, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Stop only the owned fixture
        if: always()
        run: |
          status=0
          make synchrod-pg-test-stop || status=$?
          make local-postgres-stop || status=$?
          exit "$status"
      - name: Delete the diagnostic simulator
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: ios-min-fixture-diagnostic
          path: dist/fixture-diagnostic/startup.json
          if-no-files-found: error
