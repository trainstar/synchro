name: Diagnose Kotlin Maven resolution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Diagnose Kotlin Maven resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install the declared Android build components
        run: |
          task_sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$task_sdkmanager"
          yes | "$task_sdkmanager" --licenses > /dev/null
          "$task_sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
      - name: Inspect exact public metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maven-metadata"
          while read -r path; do
            file="$RUNNER_TEMP/maven-metadata/$(basename "$path")"
            curl -q -L -sS --connect-timeout 10 --max-time 30 \
              -o "$file" -w "$path status=%{http_code} bytes=%{size_download}\n" \
              "https://repo.maven.apache.org/maven2/$path"
            sha256sum "$file"
          done <<'PATHS'
          junit/junit/4.13.2/junit-4.13.2.pom
          org/robolectric/robolectric/4.11.1/robolectric-4.11.1.pom
          com/squareup/okhttp3/mockwebserver/4.12.0/mockwebserver-4.12.0.pom
          org/jetbrains/kotlinx/kotlinx-coroutines-test/1.8.0/kotlinx-coroutines-test-1.8.0.pom
          org/jetbrains/kotlin/kotlin-reflect/1.9.22/kotlin-reflect-1.9.22.pom
          com/google/guava/listenablefuture/1.0/listenablefuture-1.0.pom
          com/google/code/findbugs/jsr305/2.0.2/jsr305-2.0.2.pom
          PATHS
      - name: Diagnose the affected Make target
        if: always()
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GOWORK: 'off'
        run: |
          make test-kotlin-unit PARTIAL=1 \
            GRADLE_TEST_ARGS='--rerun-tasks --info --stacktrace'
