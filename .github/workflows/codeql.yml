name: RC2 iOS minimum fixture diagnostic

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOWORK: 'off'
  POSTGRESQL_VERSION: '18.3'
  PGRX_VERSION: '0.17.0'
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  fixture:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 464ee2d5238a1da74f7dad5d3250f6b40586d30a
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5
      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew
      - uses: ./.github/actions/setup-conformance-pg18
      - name: Select the original Xcode and simulator tuple
        env:
          IOS_VERSION: '17.0'
          XCODE_VERSION: '27.0'
        run: |
          set -euo pipefail
          test -d "/Applications/Xcode_$XCODE_VERSION.app"
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$XCODE_VERSION"
          swift --version | grep -E 'Swift version 6[.]' >/dev/null
          if ! xcrun simctl list runtimes available -j | ruby -rjson -e 'wanted=ARGV.fetch(0); exit(JSON.parse(STDIN.read).fetch("runtimes").any? { |r| r["version"] == wanted } ? 0 : 1)' "$IOS_VERSION"; then
            umask 077
            runtime_dir="$(mktemp -d)"
            trap 'rm -rf "$runtime_dir"' EXIT
            curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --get --data-urlencode 'path=/Developer_Tools/iOS_17_Simulator_Runtime/iOS_17_Simulator_Runtime.dmg' \
              --cookie-jar "$runtime_dir/cookies" --output /dev/null \
              'https://developerservices2.apple.com/services/download'
            test -s "$runtime_dir/cookies"
            curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --cookie "$runtime_dir/cookies" --output "$runtime_dir/iOS_17_Simulator_Runtime.dmg" \
              'https://download.developer.apple.com/Developer_Tools/iOS_17_Simulator_Runtime/iOS_17_Simulator_Runtime.dmg'
            sudo xcodebuild -importPlatform "$runtime_dir/iOS_17_Simulator_Runtime.dmg"
          fi
          runtime="$(xcrun simctl list runtimes available -j | ruby -rjson -e 'wanted=ARGV.fetch(0); r=JSON.parse(STDIN.read).fetch("runtimes").find { |x| x["version"] == wanted }; abort "required iOS runtime is unavailable" unless r; puts r.fetch("identifier")' "$IOS_VERSION")"
          device="$(xcrun simctl list devicetypes -j | ruby -rjson -e 'd=JSON.parse(STDIN.read).fetch("devicetypes"); x=d.find { |i| i["name"] == "iPhone 14" } || d.find { |i| i["name"].start_with?("iPhone") }; abort "no iPhone simulator type" unless x; puts x.fetch("identifier")')"
          udid="$(xcrun simctl create Synchro_SUP-IOS-MIN-001 "$device" "$runtime")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Compare ownership-query launch and capture contexts
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import shutil
          import time

          child_source = r'''
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time

          LIMIT = 5
          COMMAND = ["lsof", "-nP", "-t", "+w", "-iTCP:8091", "-sTCP:LISTEN", "-X"]

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def stdout_class(data, complete):
              if not complete:
                  return "partial_not_admitted"
              if not data:
                  return "empty"
              lines = data.splitlines()
              if lines and all(line.isdigit() and int(line) > 0 for line in lines):
                  return "positive_decimal_lines"
              return "invalid"

          def facts(data, complete):
              return {
                  "bytes": len(data),
                  "sha256": digest(data),
                  "format": stdout_class(data, complete),
              }

          def read_file(stream):
              stream.flush()
              size = os.fstat(stream.fileno()).st_size
              return os.pread(stream.fileno(), size, 0)

          def probe(mode):
              began = time.monotonic_ns()
              spawn_began = time.monotonic_ns()
              if mode == "pipe":
                  process = subprocess.Popen(COMMAND, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  output_files = None
              else:
                  output_files = (tempfile.TemporaryFile("w+b"), tempfile.TemporaryFile("w+b"))
                  process = subprocess.Popen(COMMAND, stdout=output_files[0], stderr=output_files[1])
              spawn_ms = (time.monotonic_ns() - spawn_began) // 1_000_000
              timeout_state = "not_applicable"
              cleanup = "not_needed"
              timed_out = False
              partial_stdout = b""
              partial_stderr = b""
              try:
                  if mode == "pipe":
                      stdout, stderr = process.communicate(timeout=LIMIT)
                  else:
                      process.wait(timeout=LIMIT)
                      stdout, stderr = (read_file(output_files[0]), read_file(output_files[1]))
              except subprocess.TimeoutExpired as error:
                  timed_out = True
                  timeout_state = "running" if process.poll() is None else "exited"
                  if mode == "pipe":
                      partial_stdout = error.output or b""
                      partial_stderr = error.stderr or b""
                  else:
                      partial_stdout = read_file(output_files[0])
                      partial_stderr = read_file(output_files[1])
                  if process.poll() is None:
                      process.kill()
                  try:
                      if mode == "pipe":
                          stdout, stderr = process.communicate(timeout=LIMIT)
                      else:
                          process.wait(timeout=LIMIT)
                          stdout, stderr = (read_file(output_files[0]), read_file(output_files[1]))
                      cleanup = "completed"
                  except subprocess.TimeoutExpired as cleanup_error:
                      cleanup = "timeout"
                      if mode == "pipe":
                          stdout = cleanup_error.output or partial_stdout
                          stderr = cleanup_error.stderr or partial_stderr
                      else:
                          stdout, stderr = (read_file(output_files[0]), read_file(output_files[1]))
              finally:
                  if output_files is not None:
                      for stream in output_files:
                          stream.close()
              complete = not timed_out
              returncode = process.poll()
              return {
                  "mode": mode,
                  "spawn_ms": spawn_ms,
                  "elapsed_ms": (time.monotonic_ns() - began) // 1_000_000,
                  "timeout": "yes" if timed_out else "no",
                  "poll_at_timeout": timeout_state,
                  "returncode": returncode,
                  "accepted_exit_status": "yes" if returncode in (0, 1) else "no",
                  "cleanup": cleanup,
                  "partial_stdout": facts(partial_stdout, False),
                  "partial_stderr_bytes": len(partial_stderr),
                  "partial_stderr_sha256": digest(partial_stderr),
                  "stdout": facts(stdout, complete),
                  "stderr_bytes": len(stderr),
                  "stderr_sha256": digest(stderr),
                  "stderr_empty": "yes" if not stderr else "no",
              }

          if __name__ == "__main__":
              result = probe(os.environ["OWNERSHIP_PROBE_MODE"])
              Path(os.environ["OWNERSHIP_PROBE_RESULT"]).write_text(
                  json.dumps(result, sort_keys=True) + "\n"
              )
          '''

          temporary = Path(os.environ["RUNNER_TEMP"])
          child_path = temporary / "ownership-probe.py"
          child_path.write_text(child_source)
          child_path.chmod(0o700)
          spec = importlib.util.spec_from_file_location("ownership_probe", child_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          records = {}
          orchestration_failure = False
          for context, mode in (("owner_pipe", "pipe"), ("owner_file", "file")):
              result_path = temporary / f"{context}.json"
              log_path = temporary / f"{context}.log"
              environment = dict(os.environ)
              environment["OWNERSHIP_PROBE_MODE"] = mode
              environment["OWNERSHIP_PROBE_RESULT"] = str(result_path)
              began = time.monotonic_ns()
              spawn_began = time.monotonic_ns()
              with log_path.open("w+b") as log:
                  child = subprocess.Popen(
                      [sys.executable, str(child_path)],
                      stdin=subprocess.DEVNULL,
                      stdout=log,
                      stderr=log,
                      env=environment,
                  )
                  child_spawn_ms = (time.monotonic_ns() - spawn_began) // 1_000_000
                  child_timeout_state = "not_applicable"
                  try:
                      child.wait(timeout=12)
                  except subprocess.TimeoutExpired:
                      child_timeout_state = "running" if child.poll() is None else "exited"
                      if child.poll() is None:
                          child.kill()
                      child.wait(timeout=5)
                  log.flush()
                  log.seek(0)
                  child_log = log.read()
              if result_path.exists():
                  record = json.loads(result_path.read_text())
              else:
                  record = {"result": "missing"}
                  orchestration_failure = True
              record.update({
                  "context": context,
                  "owner_child_spawn_ms": child_spawn_ms,
                  "owner_child_elapsed_ms": (time.monotonic_ns() - began) // 1_000_000,
                  "owner_child_poll_at_timeout": child_timeout_state,
                  "owner_child_returncode": child.poll(),
                  "owner_child_log_bytes": len(child_log),
                  "owner_child_log_sha256": hashlib.sha256(child_log).hexdigest(),
              })
              if child.poll() != 0:
                  orchestration_failure = True
              records[context] = record
              result_path.unlink(missing_ok=True)
              log_path.unlink(missing_ok=True)

          records["direct_pipe"] = module.probe("pipe")
          lsof_path = shutil.which("lsof")
          if lsof_path is None:
              raise RuntimeError("required diagnostic executable is unavailable")
          summary = {
              "schema": 1,
              "ordering": ["owner_pipe", "owner_file", "direct_pipe"],
              "ordering_effect": "later_observations_may_be_order_affected",
              "source_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "lsof_sha256": hashlib.sha256(Path(lsof_path).resolve().read_bytes()).hexdigest(),
              "records": records,
          }
          child_path.unlink(missing_ok=True)
          out = Path("dist/fixture-diagnostic")
          out.mkdir(parents=True, exist_ok=True)
          (out / "ownership-query.json").write_text(json.dumps(summary, sort_keys=True) + "\n")
          print(json.dumps(summary, sort_keys=True))
          raise SystemExit(1 if orchestration_failure else 0)
          PY
      - name: Delete the diagnostic simulator
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$IOS_SIMULATOR_UDID" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: ios-min-ownership-query-diagnostic
          path: dist/fixture-diagnostic/ownership-query.json
          if-no-files-found: error
