name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  conformance-quality:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - uses: actions/cache@v5.0.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: conformance-go-${{ runner.os }}-1.25.0-${{ hashFiles('conformance/go.mod', 'conformance/go.sum') }}
          restore-keys: |
            conformance-go-${{ runner.os }}-1.25.0-

      - name: Run conformance lint checks
        env:
          GOWORK: 'off'
        run: make lint-conformance

      - name: Run conformance tests
        env:
          GOWORK: 'off'
        run: make test-conformance

  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - name: Validate release metadata alignment
        run: make version-check

      - name: Validate React Native package packing
        run: make release-npm-dry-run

  linux-pgrx-runtime:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-pgrx-pg18

      - name: Archive PG18 pgrx runtime
        run: tar -C "$HOME" -cf "$RUNNER_TEMP/pgrx-pg18-linux.tar" .pgrx

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux.tar
          compression-level: 0

  quality:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - name: Install PostgreSQL extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang \
            flex \
            bison \
            libclang-dev \
            libreadline-dev \
            libssl-dev \
            libxml2-dev \
            libxml2-utils \
            libxslt-dev \
            pkg-config \
            xsltproc \
            zlib1g-dev

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Run Go lint checks
        run: make lint-go

      - name: Run Rust lint checks
        run: make lint-rust-core

      - name: Run React Native lint checks
        run: make lint-rn

      - name: Run React Native unit tests
        run: make test-rn-unit

  docs:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs site
        run: make docs-build

  server:
    runs-on: ubuntu-24.04
    needs: [metadata, linux-pgrx-runtime]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - name: Verify PostgreSQL 18 for pgrx
        run: |
          test -f "$HOME/.pgrx/config.toml"
          grep -q '^pg18' "$HOME/.pgrx/config.toml"

      - name: Run shared core tests
        run: make test-rust-core

      - name: Run PostgreSQL extension lint checks
        run: make lint-rust-pg

      - name: Install exact Rust mutation runner
        run: cargo install --locked cargo-mutants --version 27.1.0

      - name: Run targeted Rust mutation tests
        run: make test-rust-mutants

      - name: Run PostgreSQL extension tests
        run: make test-rust-pg

      - name: Verify generated PostgreSQL SQL
        run: make check-pg-sql

      - name: Run adapter integration tests
        run: make test-adapter

  conformance-pg18:
    runs-on: ubuntu-24.04
    needs: metadata
    concurrency:
      group: conformance-pg18-installation
      cancel-in-progress: false
    env:
      GOWORK: 'off'
      PGRX_VERSION: '0.17.0'
      POSTGRESQL_VERSION: '18.3'
      RUST_TOOLCHAIN: '1.92.0'
      PGRX_TARGET_DIR: ${{ github.workspace }}/.pgrx-target
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - uses: dtolnay/rust-toolchain@1.92.0

      - name: Install PostgreSQL extension build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            clang \
            flex \
            libclang-dev \
            libreadline-dev \
            libssl-dev \
            libxml2-dev \
            libxml2-utils \
            libxslt-dev \
            pkg-config \
            xsltproc \
            zlib1g-dev

      - uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/.pgrx-target
          key: conformance-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('extensions/Cargo.lock') }}-pg${{ env.POSTGRESQL_VERSION }}-pgrx${{ env.PGRX_VERSION }}
          restore-keys: |
            conformance-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('extensions/Cargo.lock') }}-pg${{ env.POSTGRESQL_VERSION }}-pgrx${{ env.PGRX_VERSION }}-

      - name: Install exact cargo-pgrx
        run: cargo install --locked cargo-pgrx --version "$PGRX_VERSION"

      - name: Initialize exact PostgreSQL 18 runtime
        run: |
          cargo pgrx init --pg18 download

      - uses: ./.github/actions/setup-conformance-pg18
        with:
          expected-postgresql-version: ${{ env.POSTGRESQL_VERSION }}

      - name: Run isolated PostgreSQL 18 baseline
        env:
          GOWORK: 'off'
        run: make test-blackbox

      - name: Run curated integration mutation gate
        run: make test-integration-mutants

  swift-sdk:
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew

      - uses: ./.github/actions/setup-conformance-pg18
        with:
          jwt-secret-file-name: jwt-password

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: Validate Apple package metadata
        run: make release-pods-check

      - name: Run Swift integration tests
        run: make test-swift

      - name: Run packaged Swift consumer
        run: make test-consumer-swift

  rn-ios-parity:
    if: github.event_name == 'pull_request'
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: Compile React Native iOS TurboModule parity
        run: make test-rn-ios-parity

  kotlin-sdk:
    runs-on: ubuntu-24.04
    needs: [metadata, linux-pgrx-runtime]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KOTLIN_ANDROID_SERIAL: emulator-5554
      GRADLE_TEST_ARGS: ""
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - name: Verify PostgreSQL 18 for pgrx
        run: |
          test -f "$HOME/.pgrx/config.toml"
          grep -q '^pg18' "$HOME/.pgrx/config.toml"

      - name: Verify Android SDK tooling
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Set Android Java home
        run: echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Run Kotlin unit tests
        run: make test-kotlin-unit

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation release gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Synchro_Kotlin_API_34
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: make test-kotlin-instrumentation

      - name: Run Kotlin integration tests
        run: make test-kotlin

      - name: Run packaged Kotlin consumer
        run: make test-consumer-kotlin

  rn-android:
    runs-on: ubuntu-24.04
    needs: [metadata, linux-pgrx-runtime]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_TEST_ARGS: ""
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}
          restore-keys: |
            rn-deps-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - name: Verify PostgreSQL 18 for pgrx
        run: |
          test -f "$HOME/.pgrx/config.toml"
          grep -q '^pg18' "$HOME/.pgrx/config.toml"

      - name: Verify Android SDK tooling
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Set Android Java home
        run: echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Build React Native Android Detox app
        run: make test-rn-e2e-android-build

      - name: Cache Android AVD
        id: rn-android-avd-cache
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: rn-android-avd-${{ runner.os }}-api34-google-apis-x86_64-pixel_7

      - name: Generate Android AVD snapshot
        if: steps.rn-android-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Pixel_7_API_34
          profile: pixel_7
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated Android AVD snapshot"

      - name: Run React Native Android Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Pixel_7_API_34
          profile: pixel_7
          target: google_apis
          force-avd-creation: false
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: make test-rn-e2e-android-run && make test-consumer-kotlin-device && make test-consumer-rn-android
