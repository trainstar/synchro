name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  source-quality:
    name: source quality
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GOWORK: 'off'
      # rust-cache keeps extensions/target between runs.
      PGRX_TARGET_DIR: ${{ github.workspace }}/extensions/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Released update scripts are compared with their release tags.
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            extensions -> target

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: download

      - name: Install Android build components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Run source-quality tests
        run: make ci-source-quality

  pull-request-swift:
    name: pull-request Swift unit
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - name: Run Swift unit tests
        run: make test-swift-unit

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      include-swift: true

  dependency-scan:
    name: dependency scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/dependency-review.yml

  candidate-pgrx-runtime:
    name: candidate PostgreSQL runtime
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: download

      - name: Archive PostgreSQL 18 pgrx runtime
        run: tar -C "$HOME" -cf "$RUNNER_TEMP/pgrx-pg18-linux.tar" .pgrx

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux.tar
          compression-level: 0

  candidate-server:
    name: candidate server
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
      PGRX_VERSION: '0.17.0'
      POSTGRESQL_VERSION: '18.3'
      RUST_TOOLCHAIN: '1.92.0'
      PGRX_TARGET_DIR: ${{ github.workspace }}/.pgrx-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.25.0'
          cache: false

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/.pgrx-target
          key: candidate-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('extensions/Cargo.lock') }}-pg${{ env.POSTGRESQL_VERSION }}-pgrx${{ env.PGRX_VERSION }}

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: certified
          pgrx-version: ${{ env.PGRX_VERSION }}

      - uses: ./.github/actions/setup-conformance-pg18
        with:
          expected-postgresql-version: ${{ env.POSTGRESQL_VERSION }}

      - name: Install cargo-mutants
        run: cargo install --locked --force cargo-mutants --version 27.1.0

      - name: Start local PostgreSQL
        run: |
          make local-postgres-start
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Run candidate-server tests
        run: make ci-candidate-server SOAK_ARTIFACT_DIR="$RUNNER_TEMP/soak-evidence"

      - name: Retain seeded stress replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-soak-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/soak-evidence
          # A failure before the stress test leaves no journal. The test step keeps that failure.
          if-no-files-found: ignore

      - name: Stop local PostgreSQL
        if: always()
        run: make local-postgres-stop

  candidate-swift:
    name: candidate Swift
    if: github.event_name == 'push'
    runs-on: macos-15
    env:
      ANDROID_HOME: /Users/runner/Library/Android/sdk
      ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew

      - uses: ./.github/actions/setup-conformance-pg18

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Export Android Java home
        run: echo "ANDROID_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Ensure CocoaPods is available
        run: command -v pod >/dev/null 2>&1 || sudo gem install cocoapods

      - name: Start local PostgreSQL
        run: |
          set -euo pipefail
          make local-postgres-start
          attach="$GITHUB_WORKSPACE/.ignore/r2/tmp/local-postgres/attach.env"
          SYNCHRO_ATTACH_DIR="$(dirname "$attach")"
          export SYNCHRO_ATTACH_DIR
          set -a
          # shellcheck disable=SC1090
          . "$attach"
          set +a
          adapter_test_url="$(cat .ignore/r2/tmp/local-postgres/postgres.url)"
          echo "::add-mask::$adapter_test_url"
          {
            echo "ADAPTER_TEST_URL=$adapter_test_url"
            echo "WARM_CONNECT_ENV_FILE=$attach"
          } >> "$GITHUB_ENV"

      - name: Run candidate-swift tests
        run: make ci-candidate-swift

      - name: Stop local fixture
        if: always()
        run: |
          make synchrod-pg-test-stop
          make local-postgres-stop

  candidate-kotlin:
    name: candidate Kotlin
    if: github.event_name == 'push'
    needs: candidate-pgrx-runtime
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KOTLIN_ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - uses: ./.github/actions/setup-conformance-pg18

      - name: Install Android emulator components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Start local PostgreSQL
        run: |
          make local-postgres-start
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full Kotlin semantics and consumers
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          python3 scripts/ci/run_android_emulator.py \
            --sdk-root "$ANDROID_SDK_ROOT" --sdkmanager "$SDKMANAGER" \
            --api 34 --image-api 34 --avd-name Synchro_Kotlin_API_34 --profile pixel_2 \
            --log-dir "$RUNNER_TEMP/synchro-kotlin-emulator" -- make ci-candidate-kotlin

  candidate-rn-ios:
    name: candidate React Native iOS
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: brew

      - uses: ./.github/actions/setup-conformance-pg18

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Ensure iOS tools are available
        run: |
          command -v pod >/dev/null 2>&1 || sudo gem install cocoapods
          if ! command -v applesimutils >/dev/null 2>&1; then
            brew install wix/brew/applesimutils
          fi

      - name: Start local PostgreSQL
        run: |
          set -euo pipefail
          make local-postgres-start
          attach="$GITHUB_WORKSPACE/.ignore/r2/tmp/local-postgres/attach.env"
          SYNCHRO_ATTACH_DIR="$(dirname "$attach")"
          export SYNCHRO_ATTACH_DIR
          set -a
          # shellcheck disable=SC1090
          . "$attach"
          set +a
          adapter_test_url="$(cat .ignore/r2/tmp/local-postgres/postgres.url)"
          echo "::add-mask::$adapter_test_url"
          {
            echo "ADAPTER_TEST_URL=$adapter_test_url"
            echo "WARM_CONNECT_ENV_FILE=$attach"
          } >> "$GITHUB_ENV"

      - name: Run candidate-rn-ios tests
        run: make ci-candidate-rn-ios

      - name: Stop local fixture
        if: always()
        run: |
          make synchrod-pg-test-stop
          make local-postgres-stop

  candidate-rn-android:
    name: candidate React Native Android
    if: github.event_name == 'push'
    needs: candidate-pgrx-runtime
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KOTLIN_ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pgrx-pg18-linux
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - uses: ./.github/actions/setup-conformance-pg18

      - name: Install Android emulator components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Start local PostgreSQL
        run: |
          make local-postgres-start
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Build React Native Android app
        run: make test-rn-e2e-android-build

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full React Native Android semantics and consumers
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          python3 scripts/ci/run_android_emulator.py \
            --sdk-root "$ANDROID_SDK_ROOT" --sdkmanager "$SDKMANAGER" \
            --api 34 --image-api 34 --avd-name Pixel_7_API_34 --profile pixel_7 --memory 6144 \
            --log-dir "$RUNNER_TEMP/synchro-rn-emulator" -- make ci-candidate-rn-android

  pull-request:
    name: pull-request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - source-quality
      - pull-request-swift
      - codeql
      - dependency-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Require every pull-request dependency
        run: |
          test "${{ needs.source-quality.result }}" = success
          test "${{ needs.pull-request-swift.result }}" = success
          test "${{ needs.codeql.result }}" = success
          test "${{ needs.dependency-scan.result }}" = success

  candidate:
    name: candidate
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - source-quality
      - codeql
      - dependency-scan
      - candidate-pgrx-runtime
      - candidate-server
      - candidate-swift
      - candidate-kotlin
      - candidate-rn-ios
      - candidate-rn-android
    runs-on: ubuntu-24.04
    steps:
      - name: Require every candidate dependency
        run: |
          test "${{ needs.source-quality.result }}" = success
          test "${{ needs.codeql.result }}" = success
          test "${{ needs.dependency-scan.result }}" = success
          test "${{ needs.candidate-pgrx-runtime.result }}" = success
          test "${{ needs.candidate-server.result }}" = success
          test "${{ needs.candidate-swift.result }}" = success
          test "${{ needs.candidate-kotlin.result }}" = success
          test "${{ needs.candidate-rn-ios.result }}" = success
          test "${{ needs.candidate-rn-android.result }}" = success
