name: Issue 35 hosted trace diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOWORK: 'off'

jobs:
  diagnose:
    name: diagnose Android rebuild trace
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_TEST_ARGS: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            clients/react-native/node_modules
            clients/react-native/example/node_modules
            clients/react-native/.yarn/install-state.gz
          key: rn-deps-${{ runner.os }}-${{ hashFiles('clients/react-native/yarn.lock', 'clients/react-native/package.json', 'clients/react-native/example/package.json') }}

      - uses: dtolnay/rust-toolchain@ffaa7fb73f2b6e3c49bc425913220fa3d71c3ee5 # 1.92.0

      - uses: ./.github/actions/setup-pgrx-pg18
        with:
          runtime-source: artifact
          cache-runtime: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10574367129'
          run-id: '35410763147'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pgrx-pg18-linux

      - name: Restore PostgreSQL runtime
        run: tar -C "$HOME" -xf "$RUNNER_TEMP/pgrx-pg18-linux/pgrx-pg18-linux.tar"

      - uses: ./.github/actions/setup-conformance-pg18

      - name: Install Android emulator components
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
          echo "ANDROID_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Install React Native dependencies
        working-directory: clients/react-native
        run: |
          corepack enable
          yarn install --immutable

      - name: Start local PostgreSQL
        run: |
          make local-postgres-start
          echo "ADAPTER_TEST_URL=$(cat .ignore/r2/tmp/local-postgres/postgres.url)" >> "$GITHUB_ENV"

      - name: Build unchanged React Native Android app
        run: make test-rn-e2e-android-build

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ordered setup and bounded trace diagnosis
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: Pixel_7_API_34
          profile: pixel_7
          target: google_apis
          force-avd-creation: true
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -memory 6144 -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            make android-emulator-prepare
            set +e; make test-rn-scenarios-android GO_TEST_ARGS="-v -count=1 -failfast -p 1 -run 'TestRealReactNativeCorpusAndroid/SCN-PERF-(MULTI-SCOPE-PROVENANCE|PENDING-CYCLE|QUEUE-REPLAY)-001'"; predecessor_status=$?; make test-rn-scenarios-android GO_TEST_ARGS="-v -count=12 -failfast -p 1 -run TestRealReactNativeCorpusAndroid/SCN-PERF-REBUILD-APPLY-001"; trace_status=$?; printf 'diagnostic predecessor_exit=%s rebuild_exit=%s\n' "$predecessor_status" "$trace_status"; test "$predecessor_status" -eq 0 && test "$trace_status" -eq 0

      - name: Stop local fixture
        if: always()
        run: |
          make synchrod-pg-test-stop
          make local-postgres-stop
